function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

ass="section"><div class="heading"><div><span class="micro">The collection</span><h2>Group essentials.</h2></div><a class="textlink" href="#collection">Shop all</a></div>'+cards()+'</section>'}
function newOrder(){modal('<h2>Start a group.</h2><label>Group name<input id="gn" placeholder="Your club or team"></label><p>Start a fresh order or explore the seeded campus order. A new group replaces the current local demo.</p>'+button('Create group','createGroup()')+' '+button('Open current order',"go(\'room\')",true))}
function createGroup(){if(!$('gn').value.trim())return $('gn').focus();let n=$('gn').value.trim();s=seed();s.group=n;s.code='CLUB'+Math.random().toString(36).slice(2,7).toUpperCase();s.members=[];s.memories=[];s.designs.forEach(d=>d.votes=0);my='';sessionStorage.removeItem('cf.member');save();go('studio')}
function collection(){return '<section class="section"><span class="micro">Shop COMMONFORM</span><h2>The collection.</h2><div class="actions">'+button('Find my budget fit','budget()')+button('Enter showroom','showroom()',true)+button('Style an outfit','styling()',true)+'</div><div class="chips" style="margin:24px 0">'+['All',...products.map(p=>p[0])].map((x,i)=>button(x,'setFilter('+i+')',filter!==x)).join('')+'</div>'+cards()+'</section>'}
function setFilter(i){filter=['All',...products.map(p=>p[0])][i];render()}
function budget(){modal('<h2>Find your fit.</h2><label>Budget per person (₫)<input id="budget" type="number" value="200000"></label><label>Group quantity<input id="bq" type="number" min="1" value="30"></label><label>Event date<input id="bd" type="date"></label>'+button('Show recommendations','matchBudget()')+'<div id="matches"></div>')}
function matchBudget(){let eta=new Date();eta.setDate(eta.getDate()+14);let list=products.map((p,i)=>[p,i,p[2]-($('bq').value>=30&&i<2?20000:0)]).filter(x=>x[2]<=+$('budget').value);$('matches').innerHTML='<p>Estimated delivery '+eta.toLocaleDateString('en-GB')+($('bd').value&&new Date($('bd').value)<eta?' · after your event':'')+'</p>'+ (list.map(([p,i,v])=>button(p[0]+' · '+money(v),'go(\'product/'+i+'\')',true)).join(' ')||'No match within this budget.')}
function showroom(){modal('<h2>The showroom.</h2><p>Pick a display to inspect the fabric and configure your group order.</p><div class="grid boards">'+products.map((p,i)=>'<a href="#product/'+i+'" onclick="closeBox()"><img src="'+asset(i)+'" alt="'+p[0]+'"><b>'+p[0]+'</b></a>').join('')+'</div>')}
function styling(){modal('<h2>Outfit studio.</h2><label>Merchandise<select id="look" onchange="outfit()">'+opts(products.slice(0,2).map(p=>p[0]))+'</select></label><label>Pair with<select id="pair" onchange="outfit()">'+opts(['Dark denim','Cream chinos','Black shorts'])+'</select></label><div id="lookview"></div><label>Try-on concept · add a local portrait<input type="file" accept="image/*" onchange="readImg(this,u=>{window.portrait=u;outfit()})"></label>'+button('Remove portrait','window.portrait=null;outfit()',true)+' '+button('Save outfit','saveLook()')+'<p>Saved outfits: '+s.looks.map(esc).join(', ')+'</p>');outfit()}
function outfit(){let i=$('look').selectedIndex; $('lookview').innerHTML='<div class="look" style="background:'+['#7892ad','#e9d5aa','#9c9d9e'][$('pair').selectedIndex]+'">'+(window.portrait?'<img style="width:26%;display:block;margin:auto;border-radius:50%" src="'+esc(window.portrait)+'">':'')+'<img src="'+asset(i)+'"><img src="'+asset(2)+'"></div>'}
function saveLook(){s.looks.push($('look').value+' + '+$('pair').value);save();styling()}
function product(i){let p=products[i];return '<section class="section duo"><div class="preview"><img src="'+asset(i)+'" alt="'+p[0]+'"></div><article><span class="micro">'+p[3]+'</span><h2>'+p[0]+'.</h2><p>'+money(p[2])+' per piece'+(i<2?' · '+money(p[2]-20000)+' from 30 pieces':'')+'</p><div class="actions">'+button('Customize this piece','editProduct('+i+')')+button('View budget options','budget()',true)+'</div></article></section>'}
function editProduct(i){draft={...D(),product:i};side='Front';go('studio')}
function readImg(input,done){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let c=document.createElement('canvas'),k=Math.min(1,640/im.width,640/im.height);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/webp',.75),im.width)};im.src=r.result};r.readAsDataURL(f)}
function studio(){draft??={...D()};return '<section class="section"><span class="micro">Commonform workshop</span><h2>Design studio.</h2><div class="duo"><div><div id="mock">'+mark(draft,side==='Back')+'</div><div class="tabs">'+['Front','Back'].map(x=>button(x,"flip(\'"+x+"\')",side!==x)).join('')+'</div></div><div class="panel"><h3>Make it yours.</h3><label>Starting point<select onchange="template(this.selectedIndex)">'+opts(['Choose a template','Campus Social','Athletics','DIY blank'])+'</select></label><label>Piece<select onchange="draft.product=this.selectedIndex;updateMock()">'+opts(products.map(p=>p[0]),products[draft.product][0])+'</select></label><label>'+side+' lettering<input id="letter" value="'+esc(side==='Back'?draft.back:draft.title)+'" oninput="draft[side===\'Back\'?\'back\':\'title\']=this.value;updateMock()"></label><label>Fabric finish<select onchange="draft.fabricTone=this.selectedIndex;updateMock()">'+opts(['Original','Warm tint','Monochrome'],['Original','Warm tint','Monochrome'][draft.fabricTone||0])+'</select></label><label>Print ink <input type="color" value="'+draft.color+'" oninput="draft.color=this.value;updateMock()"></label><label>Typeface<select onchange="draft.font=this.value;updateMock()">'+opts(['Arial','Georgia','monospace'],draft.font)+'</select></label><label>Print scale<input type="range" min="12" max="44" value="'+(draft.scale||24)+'" oninput="draft.scale=+this.value;updateMock()"></label><label>Upload front artwork<input type="file" accept="image/*" onchange="readImg(this,(u,w)=>{draft.logo=u;updateMock();if(w<600)say(\'Low-resolution artwork. Use a larger image for production.\')})"></label><small>Drag lettering on the mockup to position your print.</small><div class="actions">'+button('Save design','saveDesign()')+button('Open group mural','mural()',true)+button('Request sample','sample()',true)+'</div><p id="quote"></p></div></div></section>'}
function flip(v){side=v;render()}function template(i){draft.title=['','Campus Social','Athletics',''][i];side='Front';render()}
function updateMock(){if(!$('mock'))return;$('mock').innerHTML=mark(draft,side==='Back');$('quote').textContent='Estimate '+money(products[draft.product][2])+' per piece · 14 days from approval';let el=$('mock').querySelector('.print');el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{let b=el.parentNode.getBoundingClientRect();draft.x=Math.max(10,Math.min(90,(ev.clientX-b.left)/b.width*100));draft.y=Math.max(10,Math.min(90,(ev.clientY-b.top)/b.height*100));el.style.left=draft.x+'%';el.style.top=draft.y+'%'};el.onpointerup=()=>el.onpointermove=null}}
function saveDesign(){if(s.stage)return say('The order is locked. Start a new group to change the artwork.');s.designs.push({...draft,title:draft.title||'Custom design',votes:0});save();tab='Vote';go('room')}
function sample(){s.sample=true;save();say('Sample request saved for your group.')}
function mural(){modal('<h3>Group mural</h3><p>Local collaborative demo · draw or sign, then apply it to the back print.</p><canvas id="pad" width="400" height="190"></canvas><label>Member ink <input id="ink" type="color" value="#204b32"></label>'+button('Apply to back','applyMural()'));let c=$('pad'),ctx=c.getContext('2d');if(draft.mural){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=draft.mural}function point(e){let b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.strokeStyle=$('ink').value;ctx.lineWidth=3;c.onpointermove=v=>{ctx.lineTo(...point(v));ctx.stroke()}};c.onpointerup=()=>c.onpointermove=null}
function applyMural(){draft.mural=$('pad').toDataURL();side='Back';closeBox();render()}
function join(){return '<section class="section"><span class="micro">Member entrance</span><h2>Join your people.</h2><div class="panel"><label>Group code<input id="gc" value="'+esc(location.hash.split('/')[1]||'')+'" placeholder="e.g. CAMPUS30"></label>'+button('Find group','findGroup()')+'<p>Current demo code: <b>'+esc(s.code)+'</b></p></div></section>'}
function findGroup(){if($('gc').value.trim().toUpperCase()!==s.code)return say('Group code not found on this device.');go('member')}
function member(){let m=personal();if(m)return '<section class="section"><span class="micro">My order · '+esc(s.group)+'</span><h2>'+esc(m.name)+'’s order.</h2><div class="duo"><div>'+mark(D())+'</div><div class="panel"><h3>'+esc(D().title)+'</h3><p>'+esc(m.size)+' · '+m.qty+' piece(s) · Print '+esc(m.name)+' '+esc(m.num)+'</p>'+receipt(m)+'<div class="actions">'+button('Simulate payment','pay(\''+m.code+'\')')+button('My pickup pass','pass(\''+m.code+'\')',true)+button('Organizer view','go(\'room\')',true)+'</div></div></div></section>';if(s.stage)return '<section class="section"><h2>Ordering has closed.</h2>'+link('View group','room')+'</section>';return '<section class="section"><span class="micro">Member checkout · '+esc(s.group)+'</span><h2>Claim your piece.</h2><div class="duo"><div>'+mark(D())+'</div><form id="entry" class="panel"><h3>'+esc(D().title)+'</h3><label>Printed name<input name="name" required maxlength="32" oninput="personalPreview()"></label><label>Printed number (optional)<input name="num" maxlength="3" oninput="personalPreview()"></label><label>Size<select name="size">'+opts(sizes,'M')+'</select></label><label>Quantity<input name="qty" type="number" min="1" max="100" value="1" required oninput="personalPreview()"></label><label><input name="tote" type="checkbox" onchange="personalPreview()"> Add matching tote · '+money(65000)+'</label><p class="notice" id="proof">Your print preview</p><label><input required type="checkbox"> I checked the spelling and number.</label><button>Confirm my order</button></form></div></section>'}
function personalPreview(){let f=$('entry');if(!f)return;let q=+f.qty.value||1,u=P()[2]-(count()+q>=30&&D().product<2?20000:0);$('proof').textContent=(f.elements.name.value+' '+f.num.value).trim().toUpperCase()+' · '+money(q*u+(f.tote.checked?65000:0))+' estimate'}
function enroll(e){e.preventDefault();let f=e.target;if(s.stage||personal())return render();if(!f.elements.name.value.trim())return say('Enter the printed name.');my='CF-'+crypto.randomUUID().slice(0,7).toUpperCase();s.members.push({name:f.elements.name.value.trim(),num:f.num.value,size:f.size.value,qty:+f.qty.value,tote:f.tote.checked,paid:0,code:my});sessionStorage.setItem('cf.member',my);save();render()}
function receipt(m){return '<div class="piece">Merchandise · '+money(unit()*m.qty)+'</div><div class="piece">Tote add-on · '+money(m.tote?65000:0)+'</div><div class="piece">Reserve contribution · '+money(share()*m.qty)+'</div><div class="piece">Paid · '+money(m.paid)+'</div><b>Balance · '+money(bill(m)-m.paid)+'</b>'}
function pay(code){let m=s.members.find(x=>x.code===code);if(!m)return;let due=bill(m)-m.paid;if(due<=0)return say('Already settled.');let amt=m.paid===0?Math.min(50000,due):due;if(m.paid&&s.stage===0)return say('Final balances open after the group locks its order.');m.paid+=amt;save();render();say('Demo transaction reconciled: '+money(amt)+'.')}
function qr(value){let q=new QRCode(-1,1);q.addData(value);q.make();let n=q.getModuleCount(),c=document.createElement('canvas');c.width=c.height=(n+8)*5;let t=c.getContext('2d');t.fillStyle='#fff';t.fillRect(0,0,c.width,c.height);t.fillStyle='#142b20';for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(q.isDark(i,j))t.fillRect((j+4)*5,(i+4)*5,5,5);return '<img class="qr" alt="Scannable QR code" src="'+c.toDataURL()+'">'}
function pass(code){modal('<h2>Pickup pass.</h2>'+qr(code)+'<p><b>'+esc(code)+'</b></p><p>Show this code at group pickup.</p>')}
function rtab(t){tab=t;render()}function room(){return '<section class="section"><span class="micro">Organizer workspace · '+esc(s.code)+'</span><div class="heading"><h2>'+esc(s.group)+'.</h2>'+button('Invite members','invite()',true)+'</div><div class="tabs">'+['Overview','Vote','Extras','Payments','Pickup','Yearbook'].map(t=>'<button class="'+(tab===t?'on':'')+'" onclick="rtab(\''+t+'\')">'+t+'</button>').join('')+'</div>'+({'Overview':overview,'Vote':voting,'Extras':extras,'Payments':payments,'Pickup':pickup,'Yearbook':yearbook}[tab]())+'</section>'}
function invite(){let url=location.href.split('#')[0]+'#join/'+s.code;modal('<h3>Invite your group</h3><p>Group code · <b>'+esc(s.code)+'</b></p><input id="url" readonly value="'+esc(url)+'"><p>Local demo. Use the member preview to join this order on this device.</p>'+button('Copy link','copyInvite()')+' '+button('Member preview','go(\'member\')',true))}
async function copyInvite(){try{await navigator.clipboard.writeText($('url').value);say('Invite link copied.')}catch{$('url').select()}}
function alloc(){let a=Object.fromEntries(sizes.map(z=>[z,0])),weights=sizes.map((z,i)=>s.members.filter(m=>m.size===z).reduce((n,m)=>n+m.qty,0)*(1+.025*i));for(let k=0;k<extra();k++){let v=weights.map((w,i)=>w/(1+a[sizes[i]]));a[sizes[v.indexOf(Math.max(...v))]]++}return a}
function overview(){return '<div class="duo"><div class="panel"><h3>'+esc(D().title)+'</h3><div style="max-width:290px">'+mark(D())+'</div><p>'+esc(P()[0])+' · '+money(unit())+' per piece</p>'+link('Open design studio','studio',true)+'</div><div class="panel"><h3>'+count()+' pieces ordered</h3><p>'+esc(stages[s.stage])+' · '+(count()<30?(30-count())+' more to group pricing':'Group price unlocked')+'</p><p>'+sizes.map(z=>z+' · '+s.members.filter(m=>m.size===z).reduce((n,m)=>n+m.qty,0)).join(' &nbsp; ')+'</p><label>Spare pool<select '+(s.stage?'disabled':'')+' onchange="s.reserve=parseInt(this.value);save();render()">'+opts(['0%','5%','10%'],s.reserve+'%')+'</select></label><p>'+extra()+' spare pieces · '+money(extra()*unit())+' total · '+money(share())+' extra per ordered piece</p><small>'+Object.entries(alloc()).filter(x=>x[1]).map(([z,n])=>z+' × '+n).join(' · ')+'</small><label><input type="checkbox" '+(s.tag?'checked':'')+' '+(s.stage?'disabled':'')+' onchange="s.tag=this.checked;save()"> Include group yearbook tag</label><div class="actions">'+(s.stage?button('Track order',"rtab(\'Pickup\')"):button('Review & lock order','review()'))+link('Member view','member',true)+'</div></div></div>'}
function review(){if(!count())return say('Add at least one member before locking.');let seen=new Set,w=[];s.members.forEach(m=>{for(let v of [m.name.toLowerCase(),m.num?'#'+m.num:'']){if(!v)continue;if(seen.has(v))w.push(v);seen.add(v)}});modal('<h3>Review order proof</h3><p>'+count()+' pieces · '+extra()+' spares · '+esc(D().title)+'</p><p>'+ (w.length?'Review duplicate entries: '+esc([...new Set(w)].join(', ')):'All prints confirmed. No duplicate entries flagged.')+'</p>'+button('Approve proof & lock','lock()'))}
function lock(){s.stage=1;s.spares=alloc();save();closeBox();render()}
function voting(){return '<div class="panel"><h3>Choose the group print.</h3><label>Demo voter<select id="voter">'+opts(['Member A','Member B','Member C'])+'</select></label></div><div class="grid">'+s.designs.map((d,i)=>'<div class="panel">'+mark(d)+'<h3>'+esc(d.title)+'</h3><p>'+d.votes+' votes'+(s.approved===i?' · Approved design':'')+'</p><div class="actions">'+(!s.stage?button('Vote','vote('+i+')')+' '+button('Approve','approveDesign('+i+')',true):'Voting closed')+'</div></div>').join('')+'</div>'}
function vote(i){let who=$('voter').value,old=s.votes[who];if(old!==undefined)s.designs[old].votes--;s.votes[who]=i;s.designs[i].votes++;save();render();$('voter').value=who}
function approveDesign(i){s.approved=i;save();render()}
function extras(){return '<div class="duo"><div class="panel"><h3>Matching additions.</h3><p>Propose a matching accessory. Five interested members unlock the group quote.</p><input id="offer" placeholder="e.g. Campus enamel pin">'+button('Propose accessory','propose()')+s.offers.map((o,i)=>'<div class="piece">'+esc(o.name)+' · '+o.n+'/5 interested '+button('Count me in','interest('+i+')',true)+'</div>').join('')+'</div><div class="panel"><h3>Style your merch.</h3><p>Build a tee-and-tote outfit, preview your look and save your favorite combination.</p>'+button('Open outfit studio','styling()')+'</div></div>'}
function propose(){let n=$('offer').value.trim();if(!n)return;s.offers.push({name:n,n:1});save();render()}function interest(i){let o=s.offers[i];if(o.joined)return say('Your interest is already recorded.');o.joined=true;o.n++;save();render()}
function payments(){return '<div class="panel"><h3>Payment ledger.</h3><p>Demo transactions · '+money(s.members.reduce((a,m)=>a+m.paid,0))+' collected</p>'+button('Simulate payment reminders','remind()',true)+s.members.map(m=>'<div class="piece row"><span>'+esc(m.name)+' · '+(m.paid>=bill(m)?'Settled':m.paid?'Deposit paid':'Pending')+'<br><small>'+money(bill(m)-m.paid)+' remaining</small></span>'+button('Payment','pay(\''+m.code+'\')',true)+'</div>').join('')+'</div>'}
function remind(){say('Demo reminders queued for '+s.members.filter(m=>m.paid<bill(m)).length+' outstanding balances.')}
function pickup(){return '<div class="duo"><div class="panel"><h3>Order tracker.</h3>'+stages.map((n,i)=>'<div class="piece">'+(i<=s.stage?'●':'○')+' &nbsp; '+n+'</div>').join('')+(s.stage>0&&s.stage<4?button('Advance demo status','advance()'):'')+'<p>'+s.members.filter(m=>m.collected).length+' of '+s.members.length+' pickups complete.</p><label>Individual pickup code<input id="pc" placeholder="CF-1001"></label>'+button('Redeem pass','redeem()')+'</div><div class="panel"><h3>Spare inventory.</h3><p>'+sizes.map(z=>z+' · '+(s.spares[z]||0)).join(' &nbsp; ')+'</p><label>Use<select id="why" onchange="document.getElementById(\'ret\').hidden=this.selectedIndex!==2">'+opts(['Defective item','Late purchase','Size exchange','Fundraiser'])+'</select></label><label>Issue size<select id="ss">'+opts(sizes)+'</select></label><label id="ret" hidden>Returned size<select id="rs">'+opts(sizes)+'</select></label>'+button('Update inventory','stock()')+'</div></div>'}
function advance(){if(s.stage>0&&s.stage<4)s.stage++;save();render()}function redeem(){let m=s.members.find(x=>x.code===$('pc').value.trim().toUpperCase());if(s.stage!==4)return say('Wait until the order is ready for pickup.');if(!m)return say('Unknown pickup code.');if(m.collected)return say('Already collected.');m.collected=true;save();render();say(m.name+' · pickup confirmed.')}
function stock(){if(s.stage!==4)return say('Inventory opens after delivery.');let z=$('ss').value;if(!s.spares[z])return say('No stock in this size.');s.spares[z]--;if($('why').selectedIndex===2){let r=$('rs').value;s.spares[r]=(s.spares[r]||0)+1}save();render()}
function yearbook(){let total=new Set(s.memories.map(m=>m.author.toLowerCase())).size;return '<div class="duo"><div class="panel"><h3>Campus memory wall.</h3><p>'+total+' / 5 contributors · '+(total>=5?'Accessory reward unlocked · CLUBFIVE':'Add five voices to unlock your group accessory reward.')+'</p><form id="memory"><label>Nickname<input required name="author" maxlength="30"></label><label>Your memory<textarea required name="body" maxlength="320"></textarea></label><label>Optional group photo<input id="photo" type="file" accept="image/*"></label><button>Post memory</button></form></div><div class="panel"><h3>Digital yearbook tag.</h3>'+(s.tag?qr(location.href.split('#')[0]+'#yearbook')+'<p>Scan the woven-tag concept to open the wall. Posts stay on this device.</p>':'The organizer has disabled the group tag.')+s.memories.map(m=>'<div class="piece"><b>'+esc(m.author)+'</b><p>'+esc(m.body)+'</p>'+(m.photo?'<img class="smallpic" src="'+esc(m.photo)+'">':'')+'</div>').join('')+'</div></div>'}
function post(e){e.preventDefault();let f=e.target,m={author:f.author.value.trim(),body:f.body.value.trim()};if(!m.author||!m.body)return;function done(u){m.photo=u;s.memories.unshift(m);save();render()}if($('photo').files.length)readImg($('photo'),done);else done('')}
function render(){let [r,i]=location.hash.slice(1).split('/');let views={home,collection,studio,room,join,member,product:()=>product(Math.min(2,Math.max(0,parseInt(i)||0))),yearbook:()=>'<section class="section">'+yearbook()+'</section>'};$('app').innerHTML=(views[r]||home)();if(r==='studio')updateMock();if($('entry')){$('entry').onsubmit=enroll;personalPreview()}if($('memory'))$('memory').onsubmit=post}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render()
</script></body></html>
